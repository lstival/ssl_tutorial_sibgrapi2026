name: Deploy site to GitHub Pages

# The website lives in site/. GitHub's "deploy from a branch" option only offers the repo
# root or /docs, so this workflow publishes the site/ subdirectory instead, which keeps the
# repository layout as it is.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Lets you re-publish by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # The pretrained encoders are Git LFS objects and the site does not need them,
        # so skip the ~294 MB download.
        with:
          lfs: false

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
